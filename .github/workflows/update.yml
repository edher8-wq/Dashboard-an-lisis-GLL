name: Actualizar precios del tablero (Stooq)

on:
  schedule:
    # 23:30 UTC = ~16:30-17:30 hora Sinaloa, despues del cierre de EE.UU.
    # Lunes a viernes.
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar precios (Stooq)
        run: python build.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "GLL price bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Precios al cierre ($(date -u +%Y-%m-%d)) — actualizacion automatica Stooq"
            git push
            echo "Precios actualizados y publicados."
          else
            echo "Sin cambios de precio hoy; nada que publicar."
          fi
