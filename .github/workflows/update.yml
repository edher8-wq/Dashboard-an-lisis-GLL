name: Actualizar precios del tablero (Stooq)

on:
  schedule:
    # Cada 30 min durante el horario de mercado de EE.UU. (lun-vie).
    # 13:00-21:00 UTC cubre 9:30-16:00 ET tanto en horario de verano como de invierno.
    # (GitHub Actions puede retrasar algunos disparos; es "casi" cada 30 min.)
    - cron: "0,30 13-21 * * 1-5"
    # Un respaldo tras el cierre para asegurar el precio de cierre definitivo.
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar precios (Stooq/Yahoo)
        run: python build.py

      - name: Radar SEC EDGAR (8-K / Form 4 / 13D)
        run: python radar_edgar.py || true

      - name: Commit si hubo cambios
        run: |
          git config user.name "GLL bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html radar.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto ($(date -u +%Y-%m-%d\ %H:%MZ)): precios + radar SEC"
            git pull --rebase origin main || true
            git push
            echo "Publicado."
          else
            echo "Sin cambios; nada que publicar."
          fi
