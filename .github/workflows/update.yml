name: Actualizar precios del tablero (Stooq)

on:
  schedule:
    # Cada 30 min durante el horario de mercado de EE.UU. (lun-vie).
    # 13:00-21:00 UTC cubre 9:30-16:00 ET tanto en horario de verano como de invierno.
    # (GitHub Actions puede retrasar algunos disparos; es "casi" cada 30 min.)
    - cron: "0,30 13-21 * * 1-5"
    # Un respaldo tras el cierre para asegurar el precio de cierre definitivo.
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar precios (Stooq)
        run: python build.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "GLL price bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Precios ($(date -u +%Y-%m-%d\ %H:%MZ)) — actualizacion automatica"
            git pull --rebase origin main || true
            git push
            echo "Precios actualizados y publicados."
          else
            echo "Sin cambios de precio; nada que publicar."
          fi
